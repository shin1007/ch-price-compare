extensionId: "imbpglefhdgkhklfcncgkocofppjddie"
privacy:
  singlePurpose: "箱入り商品の価格・送料・入り数・箱数を入力し、支払総額と1個あたりの単価を計算して、候補の中で最も安い単価を比較・表示することだけを目的とした拡張機能です。"

  permissionJustifications:
    storage: "パネルやポップアップを閉じても入力途中の比較内容（価格・送料・入り数・箱数・リンク）が消えないよう、chrome.storage.session に一時保存するために使用します。データはブラウザのセッション中のみ端末内に保持され、ブラウザを終了すると削除されます。外部への送信は一切行いません。"
    sidePanel: "価格比較の入力画面を、閲覧中のページの横に表示するサイドパネルとして開くために使用します。サイドパネルとポップアップのどちらで表示するかの選択は、端末内（chrome.storage.local）にのみ保存します。外部への送信は一切行いません。"

  usesRemoteCode: false

  dataUsage:
    collects: []
    certifications:
      noSellingToThirdParties: true
      noUseUnrelatedToSinglePurpose: true
      noUseForCreditworthinessOrLending: true

