<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>価格比較グリッド</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <header class="toolbar">
        <div class="heading">
          <h1 data-i18n="title">価格比較グリッド</h1>
          <button id="shortcutHint" class="shortcut-hint" type="button" hidden></button>
        </div>
        <div class="actions" aria-label="操作">
          <button id="transposeButton" type="button" data-i18n="transpose">横向き表示</button>
          <button id="clearButton" type="button" data-i18n="clear">クリア</button>
        </div>
      </header>
      <p class="formula" aria-label="計算式"><span data-i18n="total">支払総額（円）</span> =（<span data-i18n="price">商品価格（円）</span> × <span data-i18n="boxes">購入箱数（箱）</span>） + <span data-i18n="shipping">送料（円）</span><br /><span data-i18n="unit">1個あたり単価（円）</span> = <span data-i18n="total">支払総額（円）</span> ÷（<span data-i18n="quantity">1箱の入り数（個）</span> × <span data-i18n="boxes">購入箱数（箱）</span>）</p>
      <div class="table-scroll">
        <table id="normalTable" class="hidden" aria-label="価格比較入力グリッド"></table>
        <table id="transposedTable" aria-label="価格比較入力グリッド（転置）"></table>
      </div>
      <button id="addCandidateButton" class="add-button" type="button"><span aria-hidden="true">＋</span> <span data-i18n="addCandidate">候補を追加</span></button>
    </main>

    <script src="popup.js" defer></script>
  </body>
</html>
